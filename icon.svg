<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Shield Badge -->
  <path d="M256 70 L390 130 L390 270 Q390 390 256 440 Q122 390 122 270 L122 130 Z" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Gear in Shield -->
  <circle cx="256" cy="245" r="64" fill="none" stroke="#FF9900" stroke-width="10" stroke-dasharray="16 10"/>
  <circle cx="256" cy="245" r="32" fill="#0F172A" stroke="#38BDF8" stroke-width="6"/>
  
  <!-- Lightning Bolt -->
  <path d="M265 170 L220 255 L255 255 L245 330 L295 235 L260 235 Z" fill="#FFB703" filter="url(#glow)"/>

  <!-- Text -->
  <text x="256" y="395" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4">RME MCC1</text>
</svg>
